name: 'ServiceNow Change Control (Create/Close via Token)'
description: 'Create and optionally close a ServiceNow Change using DevOps API with token auth.'

inputs:
  SN_INSTANCE_URL:
    required: true
  SN_ORCHESTRATION_TOOL_ID:
    required: true
  SN_DEVOPS_INTEGRATION_TOKEN:
    description: 'ServiceNow DevOps token'
    required: true

  job-name:
    required: true
    default: 'prod-deploy'

  short-description:
    required: true
  description:
    required: true
  implementation-plan:
    required: true
  backout-plan:
    required: true
  test-plan:
    required: true

  assignment-group:
    required: true
  assigned-to:
    required: false

  work-notes:
    required: false
  context-github:
    required: true

  actual_start_date:
    required: false
  actual_end_date:
    required: false
  deploy_status:
    required: false

  auto_close:
    required: false
    default: 'false'

  change_request_sys_id:
    required: false

outputs:
  change_request_number:
    value: ${{ steps.sn.outputs.change_request_number }}
  change_request_sys_id:
    value: ${{ steps.sn.outputs.change_request_sys_id }}
  change_request_url:
    value: ${{ steps.sn.outputs.change_request_url }}

runs:
  using: "composite"
  steps:
    - id: sn
      shell: bash
      env:
        SN_DEVOPS_INTEGRATION_TOKEN: ${{ inputs.SN_DEVOPS_INTEGRATION_TOKEN }}
      run: |
        set -e

        if [[ -z "$SN_DEVOPS_INTEGRATION_TOKEN" ]]; then
          echo "ERROR: SN_DEVOPS_INTEGRATION_TOKEN is not set"
          exit 1
        fi

        AUTH_HEADER="Authorization: Bearer $SN_DEVOPS_INTEGRATION_TOKEN"

        if [[ "${{ inputs.auto_close }}" == "true" ]]; then

          if [[ -z "${{ inputs.change_request_sys_id }}" ]]; then
            echo "ERROR: change_request_sys_id required for close"
            exit 1
          fi

          SYS_ID="${{ inputs.change_request_sys_id }}"

          echo "Closing change request: $SYS_ID"

          if [[ "${{ inputs.deploy_status }}" == "success" ]]; then
            STATE="closed_successful"
          else
            STATE="closed_incomplete"
          fi

          curl -s -X PATCH \
            "${{ inputs.SN_INSTANCE_URL }}/api/sn_devops/devops/change/${SYS_ID}" \
            -H "$AUTH_HEADER" \
            -H "Content-Type: application/json" \
            -d "{
              \"actual_start_date\": \"${{ inputs.actual_start_date }}\",
              \"actual_end_date\": \"${{ inputs.actual_end_date }}\",
              \"close_code\": \"${{ inputs.deploy_status }}\",
              \"state\": \"${STATE}\",
              \"work_notes\": \"Deployment result: ${{ inputs.deploy_status }}\"
            }"

          echo "change_request_number=" >> $GITHUB_OUTPUT
          echo "change_request_sys_id=${SYS_ID}" >> $GITHUB_OUTPUT
          echo "change_request_url=${{ inputs.SN_INSTANCE_URL }}/change_request.do?sys_id=${SYS_ID}" >> $GITHUB_OUTPUT

        else

          echo "Creating change request..."

          CHANGE_JSON=$(jq -n \
            --arg short_description "${{ inputs.short-description }}" \
            --arg description "${{ inputs.description }}" \
            --arg implementation_plan "${{ inputs['implementation-plan'] }}" \
            --arg backout_plan "${{ inputs['backout-plan'] }}" \
            --arg test_plan "${{ inputs['test-plan'] }}" \
            --arg assignment_group "${{ inputs['assignment-group'] }}" \
            --arg assigned_to "${{ inputs['assigned-to'] }}" \
            --arg work_notes "${{ inputs['work-notes'] }}" \
            '{
              autoCloseChange: false,
              attributes: {
                short_description: $short_description,
                description: $description,
                implementation_plan: $implementation_plan,
                backout_plan: $backout_plan,
                test_plan: $test_plan,
                assignment_group: $assignment_group,
                assigned_to: $assigned_to,
                work_notes: $work_notes
              }
            }')

          RESPONSE=$(curl -s -X POST \
            "${{ inputs.SN_INSTANCE_URL }}/api/sn_devops/devops/change" \
            -H "$AUTH_HEADER" \
            -H "Content-Type: application/json" \
            -d "$CHANGE_JSON")

          SYS_ID=$(echo "$RESPONSE" | jq -r '.result.sys_id // empty')
          NUMBER=$(echo "$RESPONSE" | jq -r '.result.number // empty')

          if [[ -z "$SYS_ID" ]]; then
            echo "ERROR creating change"
            echo "$RESPONSE"
            exit 1
          fi

          echo "Created change: $NUMBER"

          echo "change_request_number=${NUMBER}" >> $GITHUB_OUTPUT
          echo "change_request_sys_id=${SYS_ID}" >> $GITHUB_OUTPUT
          echo "change_request_url=${{ inputs.SN_INSTANCE_URL }}/change_request.do?sys_id=${SYS_ID}" >> $GITHUB_OUTPUT
        fi