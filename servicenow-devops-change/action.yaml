name: 'ServiceNow DevOps Change (Create or Close)'
description: >
  Wrapper around the official ServiceNow DevOps change action.
  Teams pass simple fields — this action handles context, tool-id,
  and change-request JSON construction internally.

inputs:

  # ── Connection ─────────────────────────────────────────────────────────
  SN_INSTANCE_URL:
    description: 'Full URL of your ServiceNow instance, no trailing slash.'
    required: true
  SN_ORCHESTRATION_TOOL_ID:
    description: 'sys_id of the GitHub orchestration tool record in ServiceNow.'
    required: true
  SN_DEVOPS_INTEGRATION_TOKEN:
    description: 'DevOps Integration Token from the orchestration tool record.'
    required: true

  # ── Change fields ───────────────────────────────────────────────────────
  job-name:
    description: 'Must match the exact GitHub job name this step runs in.'
    required: true
  short-description:
    description: 'Short description for the change request.'
    required: true
  description:
    description: 'Detailed description.'
    required: true
  implementation-plan:
    description: 'How the change will be implemented.'
    required: true
  backout-plan:
    description: 'How to roll back if something goes wrong.'
    required: true
  test-plan:
    description: 'How the change has been validated.'
    required: true
  assignment-group:
    description: 'sys_id of the assignment group.'
    required: true
  assigned-to:
    description: 'sys_id of the assigned person (optional).'
    required: false
    default: ''
  work-notes:
    description: 'Work notes to add to the change.'
    required: false
    default: ''
  context-github:
    description: 'Pass toJSON(github) from your workflow.'
    required: true

  # ── Close-only fields ───────────────────────────────────────────────────
  auto_close:
    description: "'true' to close an existing change, 'false' to create one."
    required: false
    default: 'false'
  change_request_sys_id:
    description: 'sys_id of the change to close. Required when auto_close is true.'
    required: false
    default: ''
  actual_start_date:
    description: 'ISO-8601 UTC deployment start time (close only).'
    required: false
    default: ''
  actual_end_date:
    description: 'ISO-8601 UTC deployment end time (close only).'
    required: false
    default: ''
  deploy_status:
    description: "'success' or anything else (close only)."
    required: false
    default: ''

outputs:
  change_request_number:
    description: 'Human-readable change number e.g. CHG0012345.'
    value: ${{ steps.sn-official.outputs.change-request-number }}
  change_request_sys_id:
    description: 'sys_id of the created or closed change request.'
    value: ${{ steps.sn-official.outputs.change-request-sys-id }}

runs:
  using: "composite"
  steps:

    - name: Build change-request JSON
      id: build-json
      shell: bash
      run: |
        if [[ "${{ inputs.auto_close }}" == "true" ]]; then
          if [[ "${{ inputs.deploy_status }}" == "success" ]]; then
            STATE="closed_successful"
            CLOSE_CODE="successful"
          else
            STATE="closed_incomplete"
            CLOSE_CODE="unsuccessful"
          fi
          JSON=$(jq -cn \
            --arg sys_id      "${{ inputs.change_request_sys_id }}" \
            --arg state       "${STATE}" \
            --arg close_code  "${CLOSE_CODE}" \
            --arg start       "${{ inputs.actual_start_date }}" \
            --arg end         "${{ inputs.actual_end_date }}" \
            --arg notes       "${{ inputs.work-notes }}" \
            '{
              attributes: {
                sys_id:            $sys_id,
                state:             $state,
                close_code:        $close_code,
                actual_start_date: $start,
                actual_end_date:   $end,
                work_notes:        $notes
              }
            }')
        else
          JSON=$(jq -cn \
            --arg short   "${{ inputs.short-description }}" \
            --arg desc    "${{ inputs.description }}" \
            --arg impl    "${{ inputs.implementation-plan }}" \
            --arg back    "${{ inputs.backout-plan }}" \
            --arg test    "${{ inputs.test-plan }}" \
            --arg group   "${{ inputs.assignment-group }}" \
            --arg person  "${{ inputs.assigned-to }}" \
            --arg notes   "${{ inputs.work-notes }}" \
            '{
              attributes: {
                short_description:   $short,
                description:         $desc,
                implementation_plan: $impl,
                backout_plan:        $back,
                test_plan:           $test,
                assignment_group:    $group,
                assigned_to:         $person,
                work_notes:          $notes
              }
            }')
        fi
        echo "change_json=${JSON}" >> "$GITHUB_OUTPUT"

    - name: Call ServiceNow DevOps change action
      id: sn-official
      uses: ServiceNow/servicenow-devops-change@v5.1.0
      with:
        devops-integration-token: ${{ inputs.SN_DEVOPS_INTEGRATION_TOKEN }}
        instance-url:             ${{ inputs.SN_INSTANCE_URL }}
        tool-id:                  ${{ inputs.SN_ORCHESTRATION_TOOL_ID }}
        context-github:           ${{ inputs.context-github }}
        job-name:                 ${{ inputs.job-name }}
        change-request:           ${{ steps.build-json.outputs.change_json }}
